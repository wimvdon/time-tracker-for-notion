# Deploys the "Sign in with Notion" Cloudflare Worker (worker/) when it changes on main.
# Needs two repository secrets: CLOUDFLARE_API_TOKEN (a token with the "Edit Cloudflare Workers"
# template) and CLOUDFLARE_ACCOUNT_ID. Until both are set, the deploy is skipped with a note.
# The Worker's own secrets (Notion client ID and secret, state secret) live in Cloudflare only.
# See docs/notion-sign-in-setup.md.
name: Deploy worker

on:
  push:
    branches: [main]
    paths:
      - worker/**
      - .github/workflows/worker.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-worker
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy worker
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: windows/.nvmrc

      - name: Unit tests
        working-directory: worker
        run: npm test

      - name: Check the Cloudflare secrets
        id: secrets
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$TOKEN" ] && [ -n "$ACCOUNT" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "### Worker not deployed" >> "$GITHUB_STEP_SUMMARY"
            echo "Add the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets (docs/notion-sign-in-setup.md), then run this workflow again." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Deploy to Cloudflare
        if: steps.secrets.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          command: deploy
