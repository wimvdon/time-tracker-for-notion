# Checks every change, following the windows-electron-app and android-app templates:
#  - "Windows checks" (Linux, fast): lint, unit tests, UI build, dependency audit.
#  - "Windows build": builds the Dev installer, installs, starts and uninstalls it on a real
#    Windows machine, and attaches it to the run so it can be tested on a PC.
#  - "Android": release-script tests, unit tests, lint, debug + release builds, and the debug
#    APK attached to the run so it can be tested on a phone.
#  - "Worker": unit tests of the "Sign in with Notion" Cloudflare Worker (worker/).
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A new push to the same pull request cancels the older, now outdated, run.
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  windows:
    name: Windows checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: windows/.nvmrc
          cache: npm
          cache-dependency-path: windows/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build the UI
        run: npm run build

      - name: Audit the dependencies that ship in the app
        run: npm audit --omit=dev --audit-level=high

  # Builds the "Time Tracker for Notion Dev" installer, which installs next to the real app with
  # its own settings, and checks on a real Windows machine that it installs, starts and uninstalls.
  windows-installer:
    name: Windows build
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history and tags, for the git-describe version of Dev builds.
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: windows/.nvmrc
          cache: npm
          cache-dependency-path: windows/package-lock.json

      - name: Cache Electron downloads
        uses: actions/cache@v6
        with:
          path: |
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: electron-${{ runner.os }}-${{ hashFiles('windows/package-lock.json') }}
          restore-keys: electron-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      - name: Version the Dev build
        shell: bash
        run: |
          # e.g. 1.2.0-dev.3+abc1234: 3 commits after v1.2.0, so it never looks like a release.
          describe="$(git describe --tags --long --match 'v[0-9]*' 2>/dev/null || true)"
          if [[ "$describe" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)-([0-9]+)-g([0-9a-f]+)$ ]]; then
            version="${BASH_REMATCH[1]}-dev.${BASH_REMATCH[2]}+${BASH_REMATCH[3]}"
          else
            version="0.0.0-dev+$(git rev-parse --short HEAD)"
          fi
          npm version "$version" --no-git-tag-version --allow-same-version

      - name: Build the Dev installer
        run: npm run dist:dev -- --publish never

      - name: Find the installer
        id: installer
        shell: bash
        run: |
          set -euo pipefail
          # "<product> Setup <version>.exe" (not the temporary *.__uninstaller.exe).
          name=""
          for file in ../release/*Setup*.exe; do
            case "$file" in *__uninstaller*) ;; *) [ -e "$file" ] && name="$(basename "$file")" && break ;; esac
          done
          [ -n "$name" ] || { echo "::error::No installer found in release/"; exit 1; }
          {
            echo "path=../release/$name"
            echo "artifact=release/$name"
          } >> "$GITHUB_OUTPUT"
          echo "### Dev installer: \`$name\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Download it from **Artifacts** below. It installs as *Time Tracker for Notion Dev*, next to your real app, with its own settings." >> "$GITHUB_STEP_SUMMARY"

      - name: Install, start and uninstall it
        shell: pwsh
        run: ./scripts/smoke-test-installer.ps1 -Installer '${{ steps.installer.outputs.path }}' -ProductName 'Time Tracker for Notion Dev' -WindowTitle 'Time Tracker'

      - name: Upload the installer
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.installer.outputs.artifact }}
          # A plain .exe (not a zip), so it can be run straight from the download.
          archive: false
          retention-days: 3
          if-no-files-found: error

  worker:
    name: Worker
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: windows/.nvmrc

      - name: Unit tests
        run: npm test

  android:
    name: Android
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - name: Check out (full history, needed for git-describe versions)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle (with caching)
        uses: gradle/actions/setup-gradle@v6
        with:
          # Open-source (MIT) cache implementation, no extra terms of use.
          cache-provider: basic

      - name: Test release scripts
        run: python3 -m unittest discover -s scripts/tests -v

      - name: Unit tests
        run: ./gradlew testDebugUnitTest

      - name: Lint
        run: ./gradlew lintDebug

      - name: Build debug and release APKs
        # The release build is unsigned here; building it catches R8/shrinking problems early.
        run: ./gradlew assembleDebug assembleRelease

      - name: Name the debug APK
        id: apk
        run: |
          base="$(./gradlew -q :app:printApkBaseName)"
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/${base}-debug.apk"
          echo "path=android/dist/${base}-debug.apk" >> "$GITHUB_OUTPUT"
          echo "### Debug APK: \`${base}-debug.apk\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Download it from **Artifacts** at the bottom of this page and install it on your phone. It installs as *Time Tracker Dev*, next to your real app." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.apk.outputs.path }}
          # Uploaded as a plain .apk (not a zip) so a phone can install it directly.
          archive: false
          retention-days: 3
          if-no-files-found: error

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-reports
          path: |
            android/app/build/reports/
            android/app/build/test-results/
          retention-days: 3
          if-no-files-found: ignore
