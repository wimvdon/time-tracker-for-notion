# Builds both apps. A release uploads the Android app bundle (AAB) to Google Play's internal
# testing track and keeps the Windows installer as a file of the run; then it creates the tag.
# No GitHub Release and no public APK or installer: the repository is public (docs/decisions.md).
# Follows the windows-electron-app and android-app templates.
#
# How to start it:
#   - Actions tab -> Release -> Run workflow -> choose "patch", "minor" or "major".
#     The next version is computed from the latest vX.Y.Z tag; after both apps are built and
#     tested and Play accepted the bundle, the tag is created.
#   - Choose "none" to only build downloadable files (a Dev installer, an APK and an AAB): no
#     upload, no tag. The APK and AAB have versionCode 1, so they cannot update an installed app.
#   - Or push a tag yourself: git tag v1.2.3 && git push origin v1.2.3
#
# It refuses to publish when: not on main, the tag already exists, the new version is not
# higher than the previous one, or nothing changed since the previous release. The Windows
# installer is installed, started and uninstalled on a Windows machine first.
#
# Signing the Android app uses four repository secrets (see docs/installation.md):
# ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD.
# This key is the Play upload key. Without them a publish fails; a "none" build falls back to a
# debug APK with a warning. The Play upload needs the secret PLAY_SERVICE_ACCOUNT_JSON.
name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump (none = build files only, no release)"
        type: choice
        options: [none, patch, minor, major]
        default: none

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  plan:
    name: Decide the version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      publish: ${{ steps.plan.outputs.publish }}
      tag: ${{ steps.plan.outputs.tag }}
      version: ${{ steps.plan.outputs.version }}
      code: ${{ steps.plan.outputs.code }}
      previous: ${{ steps.plan.outputs.previous }}
      dev: ${{ steps.plan.outputs.dev }}
    steps:
      - name: Check out (full history, needed for tags)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Decide version and check release rules
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          BUMP: ${{ inputs.bump }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          fail() { echo "::error title=Release refused::$1"; exit 1; }
          version_tool() { python3 android/scripts/release_version.py "$@"; }
          # The checkout above (fetch-depth: 0) already has origin/main and every tag. It keeps no
          # credentials, so no further git commands may talk to GitHub; use the gh API instead.
          # Highest vX.Y.Z tag (by version, not date), optionally excluding one tag.
          latest_tag() {
            git tag --list 'v*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | grep -vxF "${1:-}" | head -n 1 || true
          }

          if [ "$EVENT" = "push" ]; then
            tag="$GITHUB_REF_NAME"
            version="$(version_tool parse-tag "$tag")" || fail "Tag $tag must look like v1.2.3."
            git merge-base --is-ancestor "$GITHUB_SHA" origin/main || fail "Tag $tag points to a commit that is not on main."
            if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then fail "A release for $tag already exists."; fi
            previous="$(latest_tag "$tag")"
          elif [ "${BUMP:-none}" = "none" ]; then
            # Not a release: the latest release plus "-dev" and the commit, e.g. 1.0.0-dev+abc1234.
            latest="$(latest_tag)"
            latest="${latest#v}"
            {
              echo "publish=false"
              echo "dev=${latest:-0.0.0}-dev+$(git rev-parse --short HEAD)"
            } >> "$GITHUB_OUTPUT"
            echo "Build only: a Dev installer and an APK, no tag and no release."
            exit 0
          else
            [ "$GITHUB_REF" = "refs/heads/main" ] || fail "Releases can only be made from main (this run is on $GITHUB_REF_NAME)."
            previous="$(latest_tag)"
            version="$(version_tool next "$previous" "$BUMP")" || fail "Could not compute the next version."
            tag="v$version"
            if git rev-parse --quiet --verify "refs/tags/$tag" >/dev/null || gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" >/dev/null 2>&1; then
              fail "Tag $tag already exists."
            fi
          fi

          if [ -n "$previous" ]; then
            version_tool is-newer "$version" "${previous#v}" \
              || fail "Version $version is not higher than the previous release $previous; installed apps would not update."
            [ "$(git rev-list --count "$previous..$GITHUB_SHA")" -gt 0 ] \
              || fail "No commits since the previous release $previous. Nothing to release."
          fi
          code="$(version_tool code "$version")" || fail "Version $version cannot be used."

          {
            echo "publish=true"
            echo "tag=$tag"
            echo "version=$version"
            echo "code=$code"
            echo "previous=$previous"
          } >> "$GITHUB_OUTPUT"
          echo "Releasing $tag (Android versionCode $code); previous release: ${previous:-none}."

  windows:
    name: Windows installer
    needs: plan
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: windows
    env:
      PUBLISH: ${{ needs.plan.outputs.publish }}
      VERSION: ${{ needs.plan.outputs.publish == 'true' && needs.plan.outputs.version || needs.plan.outputs.dev }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: windows/.nvmrc
          cache: npm
          cache-dependency-path: windows/package-lock.json

      - name: Cache Electron downloads
        uses: actions/cache@v6
        with:
          path: |
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: electron-${{ runner.os }}-${{ hashFiles('windows/package-lock.json') }}
          restore-keys: electron-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      - name: Set the version
        shell: bash
        run: npm version "$VERSION" --no-git-tag-version --allow-same-version

      - name: Lint and unit tests
        run: npm run lint && npm test

      # A release builds the real app; a build-only run builds the Dev app, which installs next
      # to the real one, so trying it never replaces your installed app or its settings.
      - name: Build the installer
        shell: bash
        run: |
          if [ "$PUBLISH" = "true" ]; then npm run dist -- --publish never; else npm run dist:dev -- --publish never; fi

      - name: Find the installer
        id: installer
        shell: bash
        run: |
          set -euo pipefail
          name=""
          for file in ../release/*Setup*.exe; do
            case "$file" in *__uninstaller*) ;; *) [ -e "$file" ] && name="$(basename "$file")" && break ;; esac
          done
          [ -n "$name" ] || { echo "::error::No installer found in release/"; exit 1; }
          product="Time Tracker for Notion"
          if [ "$PUBLISH" != "true" ]; then product="$product Dev"; fi
          {
            echo "path=../release/$name"
            echo "artifact=release/$name"
            echo "product=$product"
          } >> "$GITHUB_OUTPUT"
          echo "### Built \`$name\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Install, start and uninstall it
        shell: pwsh
        run: ./scripts/smoke-test-installer.ps1 -Installer '${{ steps.installer.outputs.path }}' -ProductName '${{ steps.installer.outputs.product }}' -WindowTitle 'Time Tracker'

      # For a release this is where the installer is downloaded from (no GitHub Release).
      - name: Upload the installer
        uses: actions/upload-artifact@v7
        with:
          name: windows
          path: ${{ steps.installer.outputs.artifact }}
          retention-days: 90
          if-no-files-found: error

  android:
    name: Android checks
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - name: Check out (full history, needed for git-describe versions)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle (with caching)
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Prepare signing key
        id: signing
        env:
          PUBLISH: ${{ needs.plan.outputs.publish }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=""
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            if [ "$PUBLISH" = "true" ]; then
              echo "::error title=Signing secrets missing::Add these repository secrets before releasing:$missing (see docs/installation.md)."
              exit 1
            fi
            echo "::warning title=Signing secrets missing::$missing not set. Building a DEBUG APK instead of a signed release."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          keystore="$RUNNER_TEMP/release.keystore"
          python3 scripts/decode_keystore.py "$keystore"

          # Check the keystore password and alias before spending time on the build.
          if ! keytool -list -keystore "$keystore" -storepass:env ANDROID_KEYSTORE_PASSWORD >/dev/null 2>&1; then
            echo "::error title=Keystore password::The keystore does not open with ANDROID_KEYSTORE_PASSWORD. Check that secret."
            exit 1
          fi
          if ! keytool -list -keystore "$keystore" -storepass:env ANDROID_KEYSTORE_PASSWORD -alias "$ANDROID_KEY_ALIAS" >/dev/null 2>&1; then
            count="$(keytool -list -keystore "$keystore" -storepass:env ANDROID_KEYSTORE_PASSWORD 2>/dev/null | grep -c 'PrivateKeyEntry' || true)"
            echo "::error title=Key alias::ANDROID_KEY_ALIAS is not in the keystore (it holds $count key(s)). Check the alias you used with keytool -genkeypair."
            exit 1
          fi
          # keytool cannot check the key password of PKCS12 keystores, so check it with Java.
          java scripts/VerifySigningKey.java "$keystore"

          umask 077
          {
            echo "storeFile=$keystore"
            echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "keyPassword=$ANDROID_KEY_PASSWORD"
          } > keystore.properties
          echo "signed=true" >> "$GITHUB_OUTPUT"
          echo "Signing key verified."

      - name: Test and lint
        run: ./gradlew testDebugUnitTest lintDebug

      # Build-only run ("none") only. A release builds its bundle in the play-internal job, so no
      # installable release file is left behind in this public repository.
      - name: Build APK and AAB (build-only run)
        id: build
        if: needs.plan.outputs.publish != 'true'
        env:
          SIGNED: ${{ steps.signing.outputs.signed }}
        run: |
          set -euo pipefail
          args=()
          base="$(./gradlew -q :app:printApkBaseName "${args[@]}")"
          mkdir -p dist
          if [ "$SIGNED" = "true" ]; then
            ./gradlew assembleRelease bundleRelease "${args[@]}"
            apk="dist/$base.apk"
            cp app/build/outputs/apk/release/app-release.apk "$apk"
            # The AAB is for the first upload by hand in the Play Console.
            cp app/build/outputs/bundle/release/app-release.aab "dist/$base.aab"
            # R8's map from the shortened names back to the real ones, to read crash stack traces.
            cp app/build/outputs/mapping/release/mapping.txt "dist/$base-mapping.txt"
            apksigner="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
            "$apksigner" verify "$apk"
            # The certificate fingerprint is public; it must stay the same for every release.
            "$apksigner" verify --print-certs "$apk" | grep -E 'certificate (DN|SHA-256 digest)' || true
          else
            ./gradlew assembleDebug "${args[@]}"
            apk="dist/$base-debug.apk"
            cp app/build/outputs/apk/debug/app-debug.apk "$apk"
          fi
          echo "apk=$apk" >> "$GITHUB_OUTPUT"
          echo "### Built \`$(basename "$apk")\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Remove signing key
        if: always()
        run: rm -f keystore.properties "$RUNNER_TEMP/release.keystore"

      - name: Upload APK, AAB and mapping file
        if: needs.plan.outputs.publish != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: android
          path: android/dist/
          retention-days: 30
          if-no-files-found: error

  # Builds the signed AAB and uploads it to Google Play's internal testing track. Runs only for a
  # release, after both apps passed their checks. It has read-only GitHub access: the third-party
  # upload action never gets a token that can write to the repository.
  # Before the first run (docs/installation.md, "Publishing the Android app through Google Play"):
  # the app exists in the Play Console, a first AAB was uploaded there by hand, and the service
  # account's JSON key is the repository secret PLAY_SERVICE_ACCOUNT_JSON.
  play-internal:
    name: Upload to Google Play (internal testing)
    needs: [plan, windows, android]
    if: needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        working-directory: android
    env:
      PACKAGE_NAME: com.impca201.notiontimetracker
    steps:
      - name: Check the Play secret
        working-directory: .
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$PLAY_SERVICE_ACCOUNT_JSON" ]; then
            echo "::error title=Play secret missing::Add the repository secret PLAY_SERVICE_ACCOUNT_JSON (see docs/installation.md, 'Publishing the Android app through Google Play')."
            exit 1
          fi

      - name: Check out (full history, needed for git-describe versions)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle (with caching)
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Build signed AAB
        env:
          # Already verified by the android job.
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VERSION: ${{ needs.plan.outputs.version }}
          CODE: ${{ needs.plan.outputs.code }}
        run: |
          set -euo pipefail
          keystore="$RUNNER_TEMP/release.keystore"
          python3 scripts/decode_keystore.py "$keystore"
          umask 077
          {
            echo "storeFile=$keystore"
            echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "keyPassword=$ANDROID_KEY_PASSWORD"
          } > keystore.properties
          args=(-PappVersionName="$VERSION" -PappVersionCode="$CODE")
          base="$(./gradlew -q :app:printApkBaseName "${args[@]}")"
          ./gradlew bundleRelease "${args[@]}"
          mkdir -p dist
          # R8's map from the shortened names back to the real ones, to read crash stack traces.
          cp app/build/outputs/mapping/release/mapping.txt "dist/$base-mapping.txt"
          echo "### Built \`$base.aab\` (versionCode $CODE)" >> "$GITHUB_STEP_SUMMARY"

      - name: Remove signing key
        if: always()
        run: rm -f keystore.properties "$RUNNER_TEMP/release.keystore"

      - name: Upload to internal testing
        # r0adkll/upload-google-play v1.1.5, pinned to its commit so a moved tag cannot change it.
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ env.PACKAGE_NAME }}
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          releaseName: ${{ needs.plan.outputs.tag }}
          mappingFile: android/app/build/outputs/mapping/release/mapping.txt
          track: internal
          status: completed

      # Kept for decoding crash reports with retrace (docs/testing.md). Not an installable file.
      - name: Upload R8 mapping file
        uses: actions/upload-artifact@v7
        with:
          name: android-mapping
          path: android/dist/
          retention-days: 90
          if-no-files-found: error

  # Creates the version tag only after both apps were built and Play accepted the bundle, so a
  # failed run can simply be run again. A pushed tag already exists, so this is skipped then.
  tag:
    name: Create the version tag
    needs: [plan, play-internal]
    if: needs.plan.outputs.publish == 'true' && github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      # The only job that may write: it creates the tag.
      contents: write
    steps:
      - name: Create tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$TAG" -f sha="$GITHUB_SHA" >/dev/null
          echo "### Released $TAG: Android to Google Play (internal testing), Windows installer under Artifacts. Tagged [$TAG]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/tree/$TAG)" >> "$GITHUB_STEP_SUMMARY"
