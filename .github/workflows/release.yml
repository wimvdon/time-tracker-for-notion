name: Release

# Push a tag like v1.2.0 to build both apps and publish them as a GitHub Release.
# "Run workflow" on the Actions tab, or a pull request that changes this file,
# builds both apps as downloadable artifacts without publishing a release.
on:
  push:
    tags:
      - "v*"
  pull_request:
    paths:
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.v.outputs.name }}
      code: ${{ steps.v.outputs.code }}
    steps:
      - id: v
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            name="${GITHUB_REF_NAME#v}"
          else
            name="1.0.0"
          fi
          if [[ ! "$name" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error::Tag must look like v1.2.3, got '$GITHUB_REF_NAME'"
            exit 1
          fi
          code=$(( BASH_REMATCH[1] * 10000 + BASH_REMATCH[2] * 100 + BASH_REMATCH[3] ))
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"

  windows:
    needs: version
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: windows/package-lock.json
      - run: npm ci
      - run: npm version "${{ needs.version.outputs.name }}" --no-git-tag-version --allow-same-version
      - run: npm test
      - run: npm run build
      - run: npx electron-builder --win --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: release/*.exe
          if-no-files-found: error

  android:
    needs: version
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Decode signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "BUILD_TYPE=release" >> "$GITHUB_ENV"
          elif [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo "::error::The ANDROID_KEYSTORE_BASE64 secret is missing. See 'Publishing a release' in the README."
            exit 1
          else
            echo "::warning::No signing key secrets, so this run builds a debug APK instead."
            echo "BUILD_TYPE=debug" >> "$GITHUB_ENV"
          fi
      - name: Build APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          task="assemble${BUILD_TYPE^}"
          ./gradlew "$task" \
            -PversionName=${{ needs.version.outputs.name }} \
            -PversionCode=${{ needs.version.outputs.code }}
          cp "app/build/outputs/apk/$BUILD_TYPE/app-$BUILD_TYPE.apk" \
            "$RUNNER_TEMP/TimeTracker-${{ needs.version.outputs.name }}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: ${{ runner.temp }}/TimeTracker-*.apk
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag'
    needs: [windows, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
