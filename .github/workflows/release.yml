name: Release

# Push a tag like v1.2.0 to build both apps and publish them as a GitHub Release.
# "Run workflow" on the Actions tab with "Release" set to patch, minor or major
# picks the next version after the latest v* tag, builds both apps and publishes
# that release (creating the tag). With "Release" left at none it only builds
# downloadable artifacts. (Pull requests are checked by the CI workflow.)
# Signing needs four repository secrets: ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
# ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      bump:
        description: Release (none = only build, patch = 1.0.0 -> 1.0.1, minor = 1.0.0 -> 1.1.0, major = 1.0.0 -> 2.0.0)
        type: choice
        options: [none, patch, minor, major]
        default: none

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.v.outputs.name }}
      code: ${{ steps.v.outputs.code }}
      publish: ${{ steps.v.outputs.publish }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - id: v
        shell: bash
        env:
          BUMP: ${{ inputs.bump || 'none' }}
        run: |
          publish=false
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            name="${GITHUB_REF_NAME#v}"
            publish=true
          elif [[ "$BUMP" != "none" ]]; then
            latest=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1)
            IFS=. read -r major minor patch <<< "${latest#v}"
            major=${major:-0}; minor=${minor:-0}; patch=${patch:-0}
            case "$BUMP" in
              major) major=$((major + 1)); minor=0; patch=0 ;;
              minor) minor=$((minor + 1)); patch=0 ;;
              patch) patch=$((patch + 1)) ;;
            esac
            name="$major.$minor.$patch"
            if git rev-parse -q --verify "refs/tags/v$name" >/dev/null; then
              echo "::error::Tag v$name already exists"
              exit 1
            fi
            echo "Latest tag ${latest:-none}, releasing v$name"
            publish=true
          else
            # Not a release: the latest release plus "-dev" and the commit, e.g. 1.0.0-dev+abc1234.
            latest=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1)
            latest=${latest#v}
            name="${latest:-0.0.0}-dev+$(git rev-parse --short HEAD)"
          fi
          if [[ ! "${name%%-*}" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error::Tag must look like v1.2.3, got '$GITHUB_REF_NAME'"
            exit 1
          fi
          code=$(( BASH_REMATCH[1] * 10000 + BASH_REMATCH[2] * 100 + BASH_REMATCH[3] ))
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"

  windows:
    needs: version
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: windows/package-lock.json
      - run: npm ci
      - run: npm version "${{ needs.version.outputs.name }}" --no-git-tag-version --allow-same-version
      - run: npm test
      - run: npm run dist -- --publish never
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: release/*.exe
          if-no-files-found: error

  android:
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5
      - name: Restore the signing key
        working-directory: .
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          PUBLISH: ${{ needs.version.outputs.publish }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            if [ "$PUBLISH" = "true" ]; then
              echo "::error::Add the ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD secrets first (see the README)."
              exit 1
            fi
            echo "::warning::No signing key secrets, so this run builds a debug APK instead."
            echo "BUILD_TYPE=debug" >> "$GITHUB_ENV"
            exit 0
          fi
          # Written to a file so the secret never appears on a command line.
          printf '%s' "$KEYSTORE_BASE64" > "$RUNNER_TEMP/keystore.b64"
          python3 .github/scripts/restore_keystore.py "$RUNNER_TEMP/keystore.b64" "$RUNNER_TEMP/release.jks"
          if ! keytool -list -keystore "$RUNNER_TEMP/release.jks" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" > /dev/null 2>&1; then
            echo "::error::The key could not be opened: check ANDROID_KEYSTORE_PASSWORD and ANDROID_KEY_ALIAS (and that ANDROID_KEYSTORE_BASE64 is the whole .jks file)."
            exit 1
          fi
          {
            echo "storeFile=$RUNNER_TEMP/release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/keystore.properties
          echo "BUILD_TYPE=release" >> "$GITHUB_ENV"
      - name: Build APK
        run: |
          task="assemble${BUILD_TYPE^}"
          ./gradlew "$task" \
            -PversionName=${{ needs.version.outputs.name }} \
            -PversionCode=${{ needs.version.outputs.code }}
          cp "app/build/outputs/apk/$BUILD_TYPE/app-$BUILD_TYPE.apk" \
            "$RUNNER_TEMP/TimeTracker-${{ needs.version.outputs.name }}.apk"
      - name: Remove the signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks" "$RUNNER_TEMP/keystore.b64" keystore.properties
      - uses: actions/upload-artifact@v7
        with:
          name: android
          path: ${{ runner.temp }}/TimeTracker-*.apk
          if-no-files-found: error

  release:
    if: needs.version.outputs.publish == 'true'
    needs: [version, windows, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.name }}
          target_commitish: ${{ github.sha }}
          name: Time Tracker for Notion ${{ needs.version.outputs.name }}
          files: dist/*
          generate_release_notes: true
