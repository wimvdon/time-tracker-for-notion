name: Release

# Push a tag like v1.2.0 to build both apps and publish them as a GitHub Release.
# "Run workflow" on the Actions tab with "Release" set to patch, minor or major
# picks the next version after the latest v* tag, builds both apps and publishes
# that release (creating the tag). With "Release" left at none it only builds
# downloadable artifacts. (Pull requests are checked by the CI workflow.)
# It refuses to publish when: not on main, the tag or release already exists, the version is
# not higher than the previous release, or nothing changed since the previous release. The
# Windows installer is installed, started and uninstalled on a Windows machine first.
# Signing needs four repository secrets: ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
# ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      bump:
        description: Release (none = only build, patch = 1.0.0 -> 1.0.1, minor = 1.0.0 -> 1.1.0, major = 1.0.0 -> 2.0.0)
        type: choice
        options: [none, patch, minor, major]
        default: none

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.v.outputs.name }}
      code: ${{ steps.v.outputs.code }}
      publish: ${{ steps.v.outputs.publish }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - id: v
        shell: bash
        env:
          BUMP: ${{ inputs.bump || 'none' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          refuse() { echo "::error title=Release refused::$1"; exit 1; }
          git fetch --quiet origin main
          # Highest vX.Y.Z tag by version (not date), optionally leaving one tag out.
          latest_tag() {
            git tag --list 'v*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | grep -vxF "${1:-}" | head -n1 || true
          }
          # "a > b" for X.Y.Z versions.
          is_newer() { [ "$1" != "$2" ] && [ "$(printf '%s\n%s\n' "$1" "$2" | sort -V | tail -n1)" = "$1" ]; }

          publish=false
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            name="${GITHUB_REF_NAME#v}"
            [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || refuse "Tag must look like v1.2.3, got '$GITHUB_REF_NAME'."
            git merge-base --is-ancestor "$GITHUB_SHA" origin/main || refuse "Tag $GITHUB_REF_NAME points to a commit that is not on main."
            if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              refuse "A release for $GITHUB_REF_NAME already exists."
            fi
            previous="$(latest_tag "$GITHUB_REF_NAME")"
            publish=true
          elif [[ "$BUMP" != "none" ]]; then
            [[ "$GITHUB_REF" == "refs/heads/main" ]] || refuse "Releases can only be made from main (this run is on $GITHUB_REF_NAME)."
            previous="$(latest_tag)"
            IFS=. read -r major minor patch <<< "${previous#v}"
            major=${major:-0}; minor=${minor:-0}; patch=${patch:-0}
            case "$BUMP" in
              major) major=$((major + 1)); minor=0; patch=0 ;;
              minor) minor=$((minor + 1)); patch=0 ;;
              patch) patch=$((patch + 1)) ;;
            esac
            name="$major.$minor.$patch"
            if git rev-parse -q --verify "refs/tags/v$name" >/dev/null || [ -n "$(git ls-remote --tags origin "refs/tags/v$name")" ]; then
              refuse "Tag v$name already exists."
            fi
            publish=true
          else
            # Not a release: the latest release plus "-dev" and the commit, e.g. 1.0.0-dev+abc1234.
            latest=$(latest_tag)
            latest=${latest#v}
            name="${latest:-0.0.0}-dev+$(git rev-parse --short HEAD)"
          fi

          if [[ "$publish" == "true" && -n "$previous" ]]; then
            is_newer "$name" "${previous#v}" \
              || refuse "Version $name is not higher than the previous release $previous; Android would refuse the update."
            [ "$(git rev-list --count "$previous..$GITHUB_SHA")" -gt 0 ] \
              || refuse "No commits since the previous release $previous. Nothing to release."
          fi
          echo "Releasing: $publish, version $name, previous release ${previous:-none}"

          if [[ ! "${name%%-*}" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error::Version must look like 1.2.3, got '$name'"
            exit 1
          fi
          code=$(( BASH_REMATCH[1] * 10000 + BASH_REMATCH[2] * 100 + BASH_REMATCH[3] ))
          {
            echo "name=$name"
            echo "code=$code"
            echo "publish=$publish"
          } >> "$GITHUB_OUTPUT"

  windows:
    needs: version
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: windows
    env:
      PUBLISH: ${{ needs.version.outputs.publish }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: windows/package-lock.json
      - name: Cache Electron downloads
        uses: actions/cache@v5
        with:
          path: |
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: electron-${{ runner.os }}-${{ hashFiles('windows/package-lock.json') }}
          restore-keys: electron-${{ runner.os }}-
      - run: npm ci
      - run: npm version "${{ needs.version.outputs.name }}" --no-git-tag-version --allow-same-version
      - run: npm run lint
      - run: npm test
      # A release builds the real app; a build-only run builds the Dev app, which installs next
      # to the real one, so trying it never replaces your installed app or its settings.
      - name: Build the installer
        shell: bash
        run: |
          if [ "$PUBLISH" = "true" ]; then npm run dist -- --publish never; else npm run dist:dev -- --publish never; fi
      - name: Find the installer
        id: installer
        shell: bash
        run: |
          set -euo pipefail
          name=""
          for file in ../release/*Setup*.exe; do
            case "$file" in *__uninstaller*) ;; *) [ -e "$file" ] && name="$(basename "$file")" && break ;; esac
          done
          [ -n "$name" ] || { echo "::error::No installer found in release/"; exit 1; }
          product="Time Tracker for Notion"
          if [ "$PUBLISH" != "true" ]; then product="$product Dev"; fi
          {
            echo "path=../release/$name"
            echo "artifact=release/$name"
            echo "product=$product"
          } >> "$GITHUB_OUTPUT"
      - name: Install, start and uninstall it
        shell: pwsh
        run: ./scripts/smoke-test-installer.ps1 -Installer '${{ steps.installer.outputs.path }}' -ProductName '${{ steps.installer.outputs.product }}' -WindowTitle 'Time Tracker'
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: ${{ steps.installer.outputs.artifact }}
          if-no-files-found: error

  android:
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5
      - name: Restore the signing key
        working-directory: .
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          PUBLISH: ${{ needs.version.outputs.publish }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            if [ "$PUBLISH" = "true" ]; then
              echo "::error::Add the ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD secrets first (see the README)."
              exit 1
            fi
            echo "::warning::No signing key secrets, so this run builds a debug APK instead."
            echo "BUILD_TYPE=debug" >> "$GITHUB_ENV"
            exit 0
          fi
          # Written to a file so the secret never appears on a command line.
          printf '%s' "$KEYSTORE_BASE64" > "$RUNNER_TEMP/keystore.b64"
          python3 .github/scripts/restore_keystore.py "$RUNNER_TEMP/keystore.b64" "$RUNNER_TEMP/release.jks"
          if ! keytool -list -keystore "$RUNNER_TEMP/release.jks" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" > /dev/null 2>&1; then
            echo "::error::The key could not be opened: check ANDROID_KEYSTORE_PASSWORD and ANDROID_KEY_ALIAS (and that ANDROID_KEYSTORE_BASE64 is the whole .jks file)."
            exit 1
          fi
          {
            echo "storeFile=$RUNNER_TEMP/release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/keystore.properties
          echo "BUILD_TYPE=release" >> "$GITHUB_ENV"
      - name: Build APK
        run: |
          task="assemble${BUILD_TYPE^}"
          ./gradlew "$task" \
            -PversionName=${{ needs.version.outputs.name }} \
            -PversionCode=${{ needs.version.outputs.code }}
          cp "app/build/outputs/apk/$BUILD_TYPE/app-$BUILD_TYPE.apk" \
            "$RUNNER_TEMP/TimeTracker-${{ needs.version.outputs.name }}.apk"
          # R8's map from the shortened names back to the real ones, so a crash from this build
          # can be read (Android Studio: Build > Analyze Stack Trace, or the retrace tool).
          if [ "$BUILD_TYPE" = release ]; then
            cp app/build/outputs/mapping/release/mapping.txt \
              "$RUNNER_TEMP/TimeTracker-${{ needs.version.outputs.name }}-mapping.txt"
          fi
      - name: Remove the signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks" "$RUNNER_TEMP/keystore.b64" keystore.properties
      - uses: actions/upload-artifact@v7
        with:
          name: android
          path: |
            ${{ runner.temp }}/TimeTracker-*.apk
            ${{ runner.temp }}/TimeTracker-*-mapping.txt
          if-no-files-found: error

  release:
    if: needs.version.outputs.publish == 'true'
    needs: [version, windows, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.name }}
          target_commitish: ${{ github.sha }}
          name: Time Tracker for Notion ${{ needs.version.outputs.name }}
          files: dist/*
          generate_release_notes: true
